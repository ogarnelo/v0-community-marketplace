name: Wetudy real Supabase Auth Storage private route local QA
on:
  pull_request:
    paths:
      - "app/api/messages/attachment/route.ts"
      - "lib/messages/private-attachment-guards.mjs"
      - "scripts/pilot-private-chat-real-supabase-route.cjs"
      - "scripts/pilot-private-chat-local-supabase-fixture.sql"
      - "supabase/migrations/20260920114500_chat_attachment_privacy_hardening.sql"
      - ".github/workflows/pilot-private-chat-real-supabase-route.yml"
permissions:
  contents: read
jobs:
  local-next-auth-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned local-only Supabase stack, SDK and compiler
        run: |
          set -euo pipefail
          npm install --prefix /tmp/wetudy-chat-local-qa --no-save --package-lock=false --no-audit --no-fund \
            supabase@2.121.0 @supabase/supabase-js@2.58.0 esbuild@0.25.12
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify real Next GET route with local GoTrue, PostgREST and Storage
        shell: bash
        env:
          PILOT_QA_MODULES: /tmp/wetudy-chat-local-qa/node_modules
        run: |
          set -euo pipefail
          cli="/tmp/wetudy-chat-local-qa/node_modules/.bin/supabase"
          stack="/tmp/wetudy-chat-local-stack"
          mkdir -p "$stack"
          docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 wetudy-chat-local-network
          cd "$stack"
          "$cli" init
          if grep -q '^enable_confirmations = true' supabase/config.toml; then
            sed -i 's/^enable_confirmations = true/enable_confirmations = false/' supabase/config.toml
          fi
          cleanup() {
            "$cli" stop --no-backup >/dev/null 2>&1 || true
            docker network rm wetudy-chat-local-network >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$cli" start --network-id wetudy-chat-local-network \
            -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          "$cli" status -o env > /tmp/wetudy-chat-local.env
          set -a
          source /tmp/wetudy-chat-local.env
          set +a
          export LOCAL_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export LOCAL_SUPABASE_ANON_KEY="${ANON_KEY:?missing local test key}"
          export LOCAL_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          cd "$GITHUB_WORKSPACE"
          psql -X -v ON_ERROR_STOP=1 "$LOCAL_DB_URL" -f scripts/pilot-private-chat-local-supabase-fixture.sql
          psql -X -v ON_ERROR_STOP=1 "$LOCAL_DB_URL" -f supabase/migrations/20260920114500_chat_attachment_privacy_hardening.sql
          node scripts/pilot-private-chat-real-supabase-route.cjs
