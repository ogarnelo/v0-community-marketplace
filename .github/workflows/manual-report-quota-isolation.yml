name: Manual report atomic quota

on:
  pull_request:
    paths:
      - "supabase/migrations/20261107222000_school_manual_report_atomic_quota.sql"
      - ".github/workflows/manual-report-quota-isolation.yml"
  workflow_dispatch:

jobs:
  atomic-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wetudy_quota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wetudy_quota_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wetudy_quota_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal service roles, users and schools
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE TABLE public.schools(id uuid PRIMARY KEY);
          INSERT INTO auth.users VALUES('11111111-1111-4111-8111-111111111111');
          INSERT INTO auth.users VALUES('22222222-2222-4222-8222-222222222222');
          INSERT INTO public.schools VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
          INSERT INTO public.schools VALUES('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          GRANT USAGE ON SCHEMA public TO service_role;
          SQL
      - name: Apply atomic quota migration to isolated PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107222000_school_manual_report_atomic_quota.sql
      - name: Verify permissions and basic per-school and per-user quota
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $checks$
          BEGIN
            IF has_function_privilege('authenticated','public.claim_school_manual_report_slot(uuid,uuid)','EXECUTE')
               OR has_function_privilege('anon','public.claim_school_manual_report_slot(uuid,uuid)','EXECUTE')
               OR has_table_privilege('authenticated','public.school_manual_report_send_claims','SELECT')
            THEN RAISE EXCEPTION 'Browser roles can claim quota or inspect claims'; END IF;
            IF NOT has_function_privilege('service_role','public.claim_school_manual_report_slot(uuid,uuid)','EXECUTE')
            THEN RAISE EXCEPTION 'service_role has no claim permission'; END IF;
          END $checks$;
          SET ROLE service_role;
          DO $claims$
          BEGIN
            IF NOT public.claim_school_manual_report_slot('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111')
               OR NOT public.claim_school_manual_report_slot('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111')
               OR public.claim_school_manual_report_slot('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111')
            THEN RAISE EXCEPTION 'Two per day quota failed'; END IF;
            IF NOT public.claim_school_manual_report_slot('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','11111111-1111-4111-8111-111111111111')
               OR NOT public.claim_school_manual_report_slot('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','22222222-2222-4222-8222-222222222222')
            THEN RAISE EXCEPTION 'Quota was not independently scoped by school and user'; END IF;
          END $claims$;
          RESET ROLE;
          SQL
      - name: Simulate concurrent submissions by six independent connections
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            psql -qAt -v ON_ERROR_STOP=1 -c "SET ROLE service_role; SELECT public.claim_school_manual_report_slot('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','22222222-2222-4222-8222-222222222222');" >"/tmp/claim_${i}.txt" &
          done
          wait
          true_claims=$(grep -hl '^t$' /tmp/claim_*.txt | wc -l)
          echo "Successful concurrent claims: ${true_claims}"
          test "${true_claims}" -eq 2
          actual=$(psql -At -c "SELECT count(*) FROM public.school_manual_report_send_claims WHERE school_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb' AND user_id='22222222-2222-4222-8222-222222222222';")
          test "${actual}" -eq 2
