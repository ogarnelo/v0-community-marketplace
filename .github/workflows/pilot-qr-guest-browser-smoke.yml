name: Wetudy pilot guest QR browser smoke (read-only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/pilot-qr-guest-browser-smoke.cjs"
      - ".github/workflows/pilot-qr-guest-browser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/pilot-qr-guest-browser-smoke.cjs"
      - ".github/workflows/pilot-qr-guest-browser-smoke.yml"

permissions:
  contents: read

concurrency:
  group: pilot-guest-qr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-qr-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install only pinned Playwright browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/wetudy-pilot-browser \
            --no-save --package-lock=false --ignore-scripts --no-audit --no-fund \
            playwright@1.65.0
          /tmp/wetudy-pilot-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Read-only public QR and guest onboarding browser checks
        shell: bash
        env:
          PLAYWRIGHT_MODULE: /tmp/wetudy-pilot-browser/node_modules/playwright
        run: |
          set -euo pipefail
          node scripts/pilot-qr-guest-browser-smoke.cjs
