name: FANPA database isolation
on:
  pull_request:
    paths:
      - "supabase/migrations/20261107192000_fanpa_federations_foundation.sql"
      - ".github/workflows/fanpa-database-isolation.yml"
  workflow_dispatch:

jobs:
  postgres-fanpa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wetudy_fanpa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wetudy_fanpa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wetudy_fanpa_test
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Supabase-like roles and existing constraints
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE TABLE public.schools (id uuid PRIMARY KEY);
          CREATE TABLE public.user_roles (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL REFERENCES auth.users(id),
            role text NOT NULL,
            school_id uuid REFERENCES public.schools(id),
            CONSTRAINT user_roles_role_check CHECK (role IN ('super_admin','school_admin')),
            CONSTRAINT user_roles_scope_check CHECK (
              (role='super_admin' AND school_id IS NULL)
              OR (role='school_admin' AND school_id IS NOT NULL)
            )
          );
          SQL
      - name: Execute FANPA schema migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107192000_fanpa_federations_foundation.sql
      - name: Verify service-only access, constraints and linked schools
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id) VALUES ('11111111-1111-4111-8111-111111111111');
          INSERT INTO public.schools (id) VALUES ('22222222-2222-4222-8222-222222222222');
          INSERT INTO public.user_roles (user_id,role,school_id)
            VALUES('11111111-1111-4111-8111-111111111111','fanpa_admin',NULL);
          INSERT INTO public.federations (id,name)
            VALUES('33333333-3333-4333-8333-333333333333','FANPA pruebas');
          INSERT INTO public.federation_admins(federation_id,user_id)
            VALUES('33333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111');
          INSERT INTO public.federation_schools(federation_id,school_id)
            VALUES('33333333-3333-4333-8333-333333333333','22222222-2222-4222-8222-222222222222');
          DO $checks$
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.federations'::regclass)
               OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.federation_admins'::regclass)
               OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.federation_schools'::regclass)
            THEN RAISE EXCEPTION 'Federation tables must use RLS'; END IF;
            IF has_table_privilege('anon','public.federations','SELECT')
               OR has_table_privilege('authenticated','public.federation_admins','SELECT')
               OR has_table_privilege('authenticated','public.federation_schools','SELECT')
            THEN RAISE EXCEPTION 'Federation tables accessible to client roles'; END IF;
            IF NOT has_table_privilege('service_role','public.federations','SELECT')
               OR NOT has_table_privilege('service_role','public.federation_admins','SELECT')
            THEN RAISE EXCEPTION 'Service role cannot operate federation scope'; END IF;
            IF (SELECT count(*) FROM public.federation_schools) <> 1
            THEN RAISE EXCEPTION 'School association was not persisted'; END IF;
            BEGIN
              INSERT INTO public.user_roles(user_id,role,school_id)
                VALUES('11111111-1111-4111-8111-111111111111','fanpa_admin',
                       '22222222-2222-4222-8222-222222222222');
              RAISE EXCEPTION 'Invalid FANPA role scope was unexpectedly allowed';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $checks$;
          SQL
