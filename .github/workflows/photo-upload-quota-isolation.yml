name: Photo upload quota isolation

on:
  pull_request:
    paths:
      - "supabase/migrations/20261107235000_photo_upload_rate_limit.sql"
      - ".github/workflows/photo-upload-quota-isolation.yml"
  workflow_dispatch:

jobs:
  postgres-photo-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wetudy_photo_quota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wetudy_photo_quota_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wetudy_photo_quota_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Supabase-like environment
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          INSERT INTO auth.users VALUES
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333');
          GRANT USAGE ON SCHEMA public TO service_role;
          SQL
      - name: Apply photo quota migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107235000_photo_upload_rate_limit.sql
      - name: Test read/execute restrictions and short-window cap
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $assert$
          BEGIN
            IF has_table_privilege('authenticated','public.photo_upload_claims','SELECT')
                OR has_table_privilege('anon','public.photo_upload_claims','INSERT')
                OR has_function_privilege('authenticated','public.claim_photo_upload_slot(uuid)','EXECUTE')
                OR has_function_privilege('anon','public.claim_photo_upload_slot(uuid)','EXECUTE')
            THEN RAISE EXCEPTION 'Photo upload quota exposed to browser roles'; END IF;
          END $assert$;
          SET ROLE service_role;
          DO $assert$
          DECLARE idx integer;
          BEGIN
            FOR idx IN 1..12 LOOP
              IF NOT public.claim_photo_upload_slot('11111111-1111-4111-8111-111111111111')
              THEN RAISE EXCEPTION 'Quota rejected upload % before 12 attempts',idx; END IF;
            END LOOP;
            IF public.claim_photo_upload_slot('11111111-1111-4111-8111-111111111111')
            THEN RAISE EXCEPTION 'Photo quota allows more than 12 uploads in 10 minutes'; END IF;
          END $assert$;
          RESET ROLE;
          SQL
      - name: Test rolling 24-hour cap independent of 10-minute cap
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          INSERT INTO public.photo_upload_claims(user_id,claimed_at)
          SELECT '22222222-2222-4222-8222-222222222222', now() - interval '1 hour'
          FROM generate_series(1,60);
          DO $assert$
          BEGIN
            IF public.claim_photo_upload_slot('22222222-2222-4222-8222-222222222222')
            THEN RAISE EXCEPTION 'Daily quota allows >60 uploads'; END IF;
          END $assert$;
          RESET ROLE;
          SQL
      - name: Race 20 independent connections against 12 permitted uploads
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for i in $(seq 1 20); do
            psql -qAt -v ON_ERROR_STOP=1 -c "SET ROLE service_role; SELECT public.claim_photo_upload_slot('33333333-3333-4333-8333-333333333333');" >"/tmp/photo_claim_${i}.txt" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          n=$(grep -hl '^t$' /tmp/photo_claim_*.txt | wc -l)
          echo "Concurrent claims granted: $n"
          test "$n" -eq 12
          rows=$(psql -qAt -c "SELECT count(*) FROM public.photo_upload_claims WHERE user_id='33333333-3333-4333-8333-333333333333'")
          test "$rows" -eq 12
