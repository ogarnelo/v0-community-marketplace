name: Wetudy isolated PostgreSQL contract drills
on:
  pull_request:
    paths:
      - "scripts/pilot-active-school-release-candidate.sql"
      - "scripts/pilot-active-school-emergency-rollback.sql"
      - "scripts/pilot-school-guard-rollout-contract.py"
      - "scripts/pilot-savings-ordering-contract.py"
      - "scripts/pilot-savings-view-candidate.sql"
      - ".github/workflows/pilot-school-guard-rollout.yml"
permissions:
  contents: read
jobs:
  school-guard-local-db:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure local PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      # The savings drill checks that this is a pristine disposable cluster
      # and creates/drops its own two API roles. The legacy school-guard test
      # creates those same roles but does not remove them; run it afterwards.
      - name: Verify full-catalogue savings order and invoker RLS in isolated DB
        env:
          LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python3 scripts/pilot-savings-ordering-contract.py
      - name: Verify failed school-guard preflight leaves zero changes and can roll back
        env:
          LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python3 scripts/pilot-school-guard-rollout-contract.py
