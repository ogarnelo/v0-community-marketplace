name: Wetudy AMPA member count 60k synthetic profile load
on:
  pull_request:
    paths:
      - "supabase/migrations/20261108211948_school_member_count_aggregate_20261108.sql"
      - "scripts/pilot-school-member-load-fixture.sql"
      - "scripts/pilot-school-member-load-benchmark.py"
      - ".github/workflows/pilot-school-member-load.yml"
permissions:
  contents: read
jobs:
  member-count-large-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wetudy_load
          POSTGRES_PASSWORD: wetudy_load
          POSTGRES_DB: wetudy_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wetudy_load -d wetudy_load"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wetudy_load:wetudy_load@127.0.0.1:5432/wetudy_load
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Load exact versioned production SQL into disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python3 - <<'PY'
          from urllib.parse import urlsplit
          import os
          u=urlsplit(os.environ["DATABASE_URL"])
          if u.hostname not in ("localhost","127.0.0.1","::1"):
              raise SystemExit("Refusing nonlocal database")
          PY
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-school-member-load-fixture.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20261108211948_school_member_count_aggregate_20261108.sql
      - name: Check cross-school counts, role grants, query plans and optional index
        run: python3 scripts/pilot-school-member-load-benchmark.py
