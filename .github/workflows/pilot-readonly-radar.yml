name: Wetudy pilot read-only radar contract
on:
  pull_request:
    paths:
      - "scripts/pilot-weekly-readonly-radar.sql"
      - "scripts/pilot-weekly-readonly-radar-check.py"
      - ".github/workflows/pilot-readonly-radar.yml"
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm health query is read-only, aggregated, single-statement
        run: python3 scripts/pilot-weekly-readonly-radar-check.py
