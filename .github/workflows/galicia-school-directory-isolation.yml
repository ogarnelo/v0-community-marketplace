name: Galicia school directory isolation

on:
  pull_request:
    paths:
      - "supabase/migrations/20261107235900_school_directory_catalog.sql"
      - ".github/workflows/galicia-school-directory-isolation.yml"
  workflow_dispatch:

jobs:
  school-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wetudy_school_directory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wetudy_school_directory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wetudy_school_directory_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare roles and one existing operational test school
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.schools(id uuid PRIMARY KEY);
          INSERT INTO public.schools VALUES('11111111-1111-4111-8111-111111111111');
          SQL
      - name: Apply informational catalog migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107235900_school_directory_catalog.sql
      - name: Test privileges, duplicate official code and unlisted-by-default
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $assert$
          BEGIN
            IF has_table_privilege('anon','public.school_directory','SELECT')
               OR has_table_privilege('authenticated','public.school_directory','SELECT')
               OR has_table_privilege('authenticated','public.school_directory','INSERT')
            THEN RAISE EXCEPTION 'Catalog privileges leaked to clients'; END IF;
            IF NOT has_table_privilege('service_role','public.school_directory','SELECT')
            THEN RAISE EXCEPTION 'Backend cannot query directory'; END IF;
          END $assert$;
          INSERT INTO public.school_directory(official_code,name,school_type,category,municipality,
              province,postal_code,source_name) VALUES
            ('36006122','CEIP A Xunqueira Nº 1','CEIP','Escolar general (tipología identificada)',
             'Pontevedra','Pontevedra','36005','Provincial CSV');
          DO $assert$
          BEGIN
            IF EXISTS(SELECT 1 FROM public.school_directory WHERE is_listed=true)
            THEN RAISE EXCEPTION 'Import automatically published school'; END IF;
            IF EXISTS(SELECT 1 FROM public.school_directory WHERE linked_school_id IS NOT NULL)
            THEN RAISE EXCEPTION 'Import automatically linked active school'; END IF;
            BEGIN
              INSERT INTO public.school_directory(official_code,name,school_type,category,municipality,
                province,postal_code,source_name) VALUES
                ('36006122','Duplicate','CEIP','school','Pontevedra','Pontevedra','36005','CSV');
              RAISE EXCEPTION 'Official code uniqueness not enforced';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO public.school_directory(official_code,name,school_type,category,municipality,
                province,postal_code,source_name,latitude,longitude) VALUES
                ('36006123','Invalid point','CEIP','school','Pontevedra','Pontevedra','36005','CSV',-8.63,42.43);
              RAISE EXCEPTION 'Swapped coordinates should be rejected';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            IF (SELECT count(*) FROM public.schools) <> 1
            THEN RAISE EXCEPTION 'Operational schools were mutated'; END IF;
          END $assert$;
          SQL
      - name: Measure synthetic 1624-row table footprint and safe filtered queries
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.school_directory (
            official_code,name,school_type,category,address,municipality,province,postal_code,
            latitude,longitude,source_name
          )
          SELECT lpad((10000000 + i)::text,8,'0'),
            'Centro educativo número ' || i || ' con denominación larga',
            'CEIP','Escolar general (tipología identificada)','Rúa de proba ' || i,
            'Pontevedra','Pontevedra','36005',42.430000,-8.640000,'Directorio sintético'
          FROM generate_series(1,1623) s(i);
          ANALYZE public.school_directory;
          DO $assert$
          BEGIN
            IF (SELECT count(*) FROM public.school_directory) <> 1624
            THEN RAISE EXCEPTION 'Unexpected directory size'; END IF;
            IF EXISTS (SELECT 1 FROM public.school_directory WHERE is_listed=true)
            THEN RAISE EXCEPTION 'Staging rows appeared publicly'; END IF;
            IF (SELECT count(*) FROM public.schools) <> 1
            THEN RAISE EXCEPTION 'Original school changed'; END IF;
          END $assert$;
          SELECT count(*) AS total_centres, pg_size_pretty(pg_total_relation_size('public.school_directory'))
          AS pg_catalog_size_with_indexes FROM public.school_directory;
          SQL
