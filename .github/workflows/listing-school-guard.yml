name: Listing school association isolation

on:
  pull_request:
    paths:
      - "supabase/migrations/20261107210000_listing_school_association_guard.sql"
      - ".github/workflows/listing-school-guard.yml"
  workflow_dispatch:

jobs:
  postgres-listing-school:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wetudy_school_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wetudy_school_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wetudy_school_guard_test
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated auth and educational data
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA private;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE SQL STABLE AS
            'SELECT NULLIF(current_setting(''request.jwt.claim.sub'',true),'''')::uuid';
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE SQL STABLE AS
            'SELECT jsonb_build_object(''role'',current_setting(''request.jwt.claim.role'',true))';
          CREATE TABLE public.schools (id uuid PRIMARY KEY);
          CREATE TABLE public.profiles (id uuid PRIMARY KEY, school_id uuid REFERENCES public.schools(id));
          CREATE TABLE public.account_students (id uuid PRIMARY KEY,owner_user_id uuid,school_id uuid REFERENCES public.schools(id),active boolean);
          CREATE TABLE public.user_roles (user_id uuid,school_id uuid,role text);
          CREATE TABLE public.listings (id uuid PRIMARY KEY,seller_id uuid,school_id uuid REFERENCES public.schools(id),title text NOT NULL);
          INSERT INTO public.schools VALUES
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333');
          INSERT INTO public.profiles VALUES
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','33333333-3333-4333-8333-333333333333');
          INSERT INTO public.account_students VALUES
            ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111',true),
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','22222222-2222-4222-8222-222222222222',true);
          SELECT set_config('request.jwt.claim.sub','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',false);
          SELECT set_config('request.jwt.claim.role','authenticated',false);
          SQL
      - name: Execute server-side listing school guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107210000_listing_school_association_guard.sql
      - name: Test authorized associations, invalid schools and old listings
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',false);
          SELECT set_config('request.jwt.claim.role','authenticated',false);
          INSERT INTO public.listings VALUES
            ('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              '11111111-1111-4111-8111-111111111111','School A'),
            ('ffffffff-ffff-4fff-8fff-ffffffffffff','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              '22222222-2222-4222-8222-222222222222','School B'),
            ('12345678-1234-4234-8234-123456789abc','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              NULL,'General');
          DO $test$
          BEGIN
            BEGIN
              INSERT INTO public.listings VALUES
                ('11112222-3333-4444-8555-666677778888',
                 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                 '33333333-3333-4333-8333-333333333333','Wrong school');
              RAISE EXCEPTION 'Unauthorized school INSERT was permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
            BEGIN
              UPDATE public.listings SET school_id='33333333-3333-4333-8333-333333333333'
                WHERE title='School A';
              RAISE EXCEPTION 'Unauthorized school UPDATE was permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
          END $test$;
          UPDATE public.account_students
            SET active=false WHERE owner_user_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
          UPDATE public.listings SET title='Editable despite old school' WHERE title='School B';
          DO $test$
          BEGIN
            BEGIN
              INSERT INTO public.listings VALUES
                ('11112222-3333-4444-8555-666677778888',
                 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                 '22222222-2222-4222-8222-222222222222','Stale student school');
              RAISE EXCEPTION 'Inactive student association was permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
          END $test$;
          INSERT INTO public.listings VALUES
            ('11112222-3333-4444-8555-666677778888',
             'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
             '11111111-1111-4111-8111-111111111111','Legacy profile fallback');
          INSERT INTO public.user_roles VALUES
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
              '22222222-2222-4222-8222-222222222222','school_admin');
          SELECT set_config('request.jwt.claim.sub','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',false);
          INSERT INTO public.listings VALUES
            ('bbbb2222-3333-4444-8555-666677778888',
             'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
             '22222222-2222-4222-8222-222222222222','School administrator');
          DO $test$
          BEGIN
            IF (SELECT count(*) FROM public.listings) <> 5
            THEN RAISE EXCEPTION 'Incorrect authorized listings after tests'; END IF;
          END $test$;
          SQL
