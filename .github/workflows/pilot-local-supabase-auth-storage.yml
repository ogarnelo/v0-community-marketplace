name: Wetudy isolated real Supabase Auth and Storage QA
on:
  pull_request:
    paths:
      - "scripts/pilot-local-supabase-auth-storage-fixture.sql"
      - "scripts/pilot-local-supabase-auth-storage.cjs"
      - "scripts/pilot-local-supabase-auth-storage-restore.cjs"
      - "supabase/migrations/20260920114500_chat_attachment_privacy_hardening.sql"
      - ".github/workflows/pilot-local-supabase-auth-storage.yml"
permissions:
  contents: read
jobs:
  local-auth-storage-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned local-only Supabase CLI and JS client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/wetudy-local-supabase-qa --no-save --package-lock=false --no-audit --no-fund \
            supabase@2.121.0 @supabase/supabase-js@2.58.0
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Boot isolated local Supabase, authenticate and check RLS/Storage
        shell: bash
        env:
          PILOT_QA_MODULES: /tmp/wetudy-local-supabase-qa/node_modules
        run: |
          set -euo pipefail
          cli="/tmp/wetudy-local-supabase-qa/node_modules/.bin/supabase"
          stack="/tmp/wetudy-local-supabase-stack"
          mkdir -p "$stack"
          docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 wetudy-local-qa-network
          cd "$stack"
          "$cli" init
          # Email signups must be confirmed immediately; no emails leave this stack.
          if grep -q '^enable_confirmations = true' supabase/config.toml; then
            sed -i 's/^enable_confirmations = true/enable_confirmations = false/' supabase/config.toml
          fi
          cleanup() {
            "$cli" stop --no-backup >/dev/null 2>&1 || true
            docker network rm wetudy-local-qa-network >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$cli" start --network-id wetudy-local-qa-network \
            -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          "$cli" status -o env > /tmp/wetudy-local-qa.env
          set -a
          source /tmp/wetudy-local-qa.env
          set +a
          export LOCAL_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export LOCAL_SUPABASE_ANON_KEY="${ANON_KEY:?missing anonymous localhost test key}"
          export LOCAL_SUPABASE_SERVICE_KEY="${SERVICE_ROLE_KEY:?missing local service key}"
          export LOCAL_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          cd "$GITHUB_WORKSPACE"
          psql -X -v ON_ERROR_STOP=1 "$LOCAL_DB_URL" -f scripts/pilot-local-supabase-auth-storage-fixture.sql
          psql -X -v ON_ERROR_STOP=1 "$LOCAL_DB_URL" -f supabase/migrations/20260920114500_chat_attachment_privacy_hardening.sql
          node scripts/pilot-local-supabase-auth-storage.cjs
          node scripts/pilot-local-supabase-auth-storage-restore.cjs
