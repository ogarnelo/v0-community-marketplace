name: WETUDY anon SELECT — real local Next browser compatibility
on:
  pull_request:
    paths:
      - "scripts/pilot-anon-select-next-browser-local-fixture.sql"
      - "scripts/pilot-anon-select-next-browser-local-e2e.cjs"
      - "__tests__/launch/pilot-anon-next-browser-local-closure.test.mjs"
      - ".github/workflows/pilot-anon-select-next-browser-local.yml"
      - "app/api/schools/public/route.ts"
      - "app/api/marketplace/feed/route.ts"
      - "lib/supabase/server.ts"
      - "lib/supabase/client.ts"
      - "lib/supabase/admin.ts"
      - "lib/supabase/proxy.ts"
      - "lib/marketplace/feed-filters.ts"
      - "lib/marketplace/postal-distance.ts"
      - "lib/types/marketplace.ts"
      - "proxy.ts"
permissions:
  contents: read
jobs:
  real-next-browser-anon-select-local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout only this PR, no persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24 for locally pinned Next 16 / Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned disposable Supabase, Next and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/wetudy-anon-next-local --no-save --package-lock=false --no-audit --no-fund \
            supabase@2.121.0 next@16.3.5 react@19.2.4 react-dom@19.2.4 \
            @supabase/ssr@0.6.1 @supabase/supabase-js@2.58.0 \
            playwright@1.65.0 typescript@5.9.3 \
            @types/node@24.10.1 @types/react@19.2.2 @types/react-dom@19.2.2
          /tmp/wetudy-anon-next-local/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Execute exact public Next routes and real signed browser sessions against disposable local Supabase
        shell: bash
        env:
          WETUDY_ANON_NEXT_MODULES: /tmp/wetudy-anon-next-local/node_modules
          WETUDY_ANON_NEXT_FIXTURE: /tmp/wetudy-anon-next-local
          PGAPPNAME: wetudy_disposable_next_browser_20261120
        run: |
          set -euo pipefail
          cli="/tmp/wetudy-anon-next-local/node_modules/.bin/supabase"
          stack="/tmp/wetudy-anon-next-stack"
          mkdir -p "$stack"
          docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 wetudy-anon-next-qa
          cd "$stack"
          "$cli" init
          if grep -q '^enable_confirmations = true' supabase/config.toml; then
            sed -i 's/^enable_confirmations = true/enable_confirmations = false/' supabase/config.toml
          fi
          cleanup() {
            "$cli" stop --no-backup >/dev/null 2>&1 || true
            docker network rm wetudy-anon-next-qa >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$cli" start --network-id wetudy-anon-next-qa \
            -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          "$cli" status -o env > /tmp/wetudy-anon-next-qa.env
          set -a
          source /tmp/wetudy-anon-next-qa.env
          set +a
          export LOCAL_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export LOCAL_SUPABASE_ANON_KEY="${ANON_KEY:?Local Supabase anon missing}"
          export LOCAL_SUPABASE_SERVICE_KEY="${SERVICE_ROLE_KEY:?Local Supabase service key missing}"
          export LOCAL_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          cd "$GITHUB_WORKSPACE"
          psql -X -v ON_ERROR_STOP=1 "$LOCAL_DB_URL" \
            -f scripts/pilot-anon-select-next-browser-local-fixture.sql
          node scripts/pilot-anon-select-next-browser-local-e2e.cjs
