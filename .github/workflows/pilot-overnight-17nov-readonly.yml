name: WETUDY overnight read-only guard (17 Nov 2026)

on:
  workflow_dispatch:
  schedule:
    # UTC 00:20, 02:20, 04:20 = Madrid CET 01:20, 03:20, 05:20 on 17 Nov.
    # GitHub cron is best effort, not an exact-time guarantee.
    - cron: "20 0,2,4 17 11 *"

permissions:
  contents: read

concurrency:
  group: wetudy-overnight-readonly
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run only on the requested night (or manual dispatch)
        id: date_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u +%F)" == "2026-11-17" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Historical one-night watch: no work after 2026-11-17." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout main without saved credentials
        if: steps.date_gate.outputs.active == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22, no dependency installation
        if: steps.date_gate.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check review-only SQL contracts and anonymous production HTTP
        if: steps.date_gate.outputs.active == 'true'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node --test __tests__/launch/pilot-donation-rls-review-contract.test.mjs > /tmp/wetudy-rls-review.txt 2>&1
          rls_result=$?
          node scripts/pilot-guest-http-smoke.mjs https://www.wetudy.com > /tmp/wetudy-guest-smoke.txt 2>&1
          guest_result=$?
          set -e
          cat /tmp/wetudy-rls-review.txt
          cat /tmp/wetudy-guest-smoke.txt
          {
            echo "## WETUDY · guardia nocturna solo lectura"
            echo
            echo "Commit verificado: \`$GITHUB_SHA\`"
            echo
            echo "Únicamente contratos locales sin instalaciones y GET sin cookies ni secretos."
            echo "Este resultado NO valida E2E autenticado, DR, grants de Supabase ni actas AMPA."
            echo "La candidata SQL P0 #591 permanece REVIEW ONLY. Piloto general NO-GO."
            echo
            echo "### Contratos SQL de revisión (exit: $rls_result)"
            echo '~~~text'
            tail -n 18 /tmp/wetudy-rls-review.txt
            echo '~~~'
            echo "### Contrato HTTP invitado (exit: $guest_result)"
            echo '~~~text'
            cat /tmp/wetudy-guest-smoke.txt
            echo '~~~'
            echo
            echo "Referencias: https://github.com/ogarnelo/v0-community-marketplace/issues/591"
            echo "https://github.com/ogarnelo/v0-community-marketplace/issues/600"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$rls_result" -eq 0 && test "$guest_result" -eq 0
