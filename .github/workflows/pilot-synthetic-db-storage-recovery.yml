name: Wetudy synthetic local PostgreSQL and Storage combined recovery
on:
  pull_request:
    paths:
      - "scripts/pilot-synthetic-db-storage-recovery.py"
      - "scripts/pilot-marketplace-real-shape-recovery.py"
      - "scripts/pilot-marketplace-saved-search-recovery.py"
      - "scripts/pilot-marketplace-rls-readonly-preflight.sql"
      - "scripts/pilot-marketplace-rls-drift-fixture.sql"
      - "scripts/pilot-marketplace-rls-drift-regression.py"
      - "scripts/pilot-client-tablewide-privileges-regression.py"
      - "scripts/pilot-privacy-acl-restore-qa.py"
      - "scripts/pilot-dr-prod-inventory-readonly.sql"
      - "scripts/pilot-dr-prod-inventory-contract.py"
      - "scripts/pilot-free-plan-backup-contract.mjs"
      - "scripts/pilot-privacy-prod-readonly-contract.py"
      - "scripts/pilot-readonly-sql-guard.py"
      - "scripts/pilot-chat-rls-prod-readonly-contract.py"
      - "scripts/pilot-privacy-prod-preflight-readonly.sql"
      - "scripts/pilot-offline-backup-zip-verify.py"
      - "scripts/pilot-offline-backup-zip-verify-tests.py"
      - "scripts/pilot-anon-listings-revoke-proposal.sql"
      - "scripts/pilot-auth-listings-sensitive-grants-proposal.sql"
      - "scripts/pilot-wave1-client-privilege-regression.py"
      - "supabase/migrations/20261111084000_pilot_wave1_revoke_client_non_rls_privileges.sql"
      - "scripts/pilot-client-tablewide-privileges-regression.sql"
      - "scripts/pilot-client-tablewide-privileges-preflight.sql"
      - "scripts/pilot-client-privilege-function-entrypoints.sql"
      - "scripts/pilot-client-privilege-function-regression.py"
      - "supabase/migrations/20261111083000_marketplace_revoke_client_table_wide_privileges.sql"
      - "scripts/verify-pilot-storage-restore.py"
      - ".github/workflows/pilot-synthetic-db-storage-recovery.yml"
permissions:
  contents: read
jobs:
  synthetic-local-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wetudy_dr
          POSTGRES_PASSWORD: local_only_password
          POSTGRES_DB: wetudy_pilot_dr_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wetudy_dr -d wetudy_pilot_dr_source"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LOCAL_RESTORE_URL: postgresql://wetudy_dr:local_only_password@127.0.0.1:5432/wetudy_pilot_dr_source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL 17 client tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Restore synthetic account surrogates, profiles, students and Storage bytes locally
        run: python3 scripts/pilot-synthetic-db-storage-recovery.py
      - name: Restore production-shaped marketplace relationships and object bytes in second local DB
        run: python3 scripts/pilot-marketplace-real-shape-recovery.py
      - name: Restore synthetic saved searches and postcode alert records locally
        run: python3 scripts/pilot-marketplace-saved-search-recovery.py
      - name: Prove production RLS policy drift gate fails for permissive policies
        run: python3 scripts/pilot-marketplace-rls-drift-regression.py
      - name: Revoke non-RLS client table privileges in disposable PostgreSQL17
        run: python3 scripts/pilot-client-tablewide-privileges-regression.py
      - name: Verify wave-1 client privilege revocation in disposable PostgreSQL17
        run: python3 scripts/pilot-wave1-client-privilege-regression.py
      - name: Assert full production DR cannot be certified from synthetic fixtures
        run: python3 scripts/pilot-dr-prod-inventory-contract.py
      - name: Fail closed on unsafe SQL in read-only production preflights
        run: python3 scripts/pilot-readonly-sql-guard.py
      - name: Check that the production privacy preflight reports anon DML grants explicitly
        run: python3 scripts/pilot-privacy-prod-readonly-contract.py
      - name: Assert chat membership RLS policies are covered by read-only preflight
        run: python3 scripts/pilot-chat-rls-prod-readonly-contract.py
      - name: Verify no-cost manual encrypted backup workflow controls
        run: node scripts/pilot-free-plan-backup-contract.mjs
      - name: Validate offline backup ZIP checker against synthetic good/bad ZIPs
        run: python3 scripts/pilot-offline-backup-zip-verify-tests.py
      - name: Recover synthetic private listing ACLs and RLS into a second local PG17 DB
        run: python3 scripts/pilot-privacy-acl-restore-qa.py
      - name: Audit client EXECUTE grants on synthetic SECURITY DEFINER functions
        run: python3 scripts/pilot-client-privilege-function-regression.py
