name: Wetudy QA-only Vercel ignore filter contract
on:
  pull_request:
    paths:
      - "scripts/vercel-ignore-qa-only.cjs"
      - ".github/workflows/pilot-vercel-ignore-qa-python.yml"
permissions:
  contents: read
jobs:
  qa-only-build-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: QA-only Python scripts skip while app, migrations and config force build
        run: node scripts/vercel-ignore-qa-only.cjs --self-test
