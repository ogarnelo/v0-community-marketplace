name: FANPA representation PG17 isolated schema gate
on:
  pull_request:
    paths:
      - "docs/pilot/sql/fanpa_service_only_representation_review_20261120.sql"
      - ".github/workflows/fanpa-representation-pg17.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-scope-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wetudy_fanpa_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wetudy_fanpa_isolated"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wetudy_fanpa_isolated
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal pre-existing roles and school constraints
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE TABLE public.schools(
            id uuid PRIMARY KEY,
            is_active boolean NOT NULL DEFAULT true,
            is_test boolean NOT NULL DEFAULT false
          );
          CREATE TABLE public.user_roles(
            user_id uuid NOT NULL REFERENCES auth.users(id),
            role text NOT NULL CHECK (role IN ('super_admin', 'school_admin')),
            school_id uuid REFERENCES public.schools(id)
          );
          SQL
      - name: Apply proposal ONLY to temporary PG17 service
        run: psql -v ON_ERROR_STOP=1 -f docs/pilot/sql/fanpa_service_only_representation_review_20261120.sql
      - name: Verify RLS, revocation, real FK, default-off and no role expansion
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
          INSERT INTO public.schools(id) VALUES
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222');
          INSERT INTO public.fanpa_federations(id,name)
            VALUES('ffffffff-ffff-4fff-8fff-ffffffffffff','Fictitious pilot federation');
          INSERT INTO public.fanpa_administrators(federation_id,user_id)
            VALUES('ffffffff-ffff-4fff-8fff-ffffffffffff',
                   'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
          INSERT INTO public.fanpa_represented_schools(federation_id,school_id)
            VALUES('ffffffff-ffff-4fff-8fff-ffffffffffff',
                   '11111111-1111-4111-8111-111111111111');
          DO $checks$
          DECLARE v_table text;
          BEGIN
            FOREACH v_table IN ARRAY ARRAY[
              'fanpa_federations','fanpa_administrators','fanpa_represented_schools'
            ] LOOP
              IF NOT (SELECT c.relrowsecurity FROM pg_class c
                    WHERE c.oid=('public.'||v_table)::regclass)
                THEN RAISE EXCEPTION 'RLS absent: %',v_table; END IF;
              IF has_table_privilege('anon','public.'||v_table,'SELECT')
                 OR has_table_privilege('authenticated','public.'||v_table,'SELECT')
                 OR has_table_privilege('authenticated','public.'||v_table,'INSERT')
                 OR has_table_privilege('authenticated','public.'||v_table,'UPDATE')
                 OR has_table_privilege('authenticated','public.'||v_table,'DELETE')
                THEN RAISE EXCEPTION 'Client grants leaked: %',v_table; END IF;
              IF NOT has_table_privilege('service_role','public.'||v_table,'SELECT')
                THEN RAISE EXCEPTION 'Service read absent: %',v_table; END IF;
              IF EXISTS (SELECT 1 FROM pg_policies
                  WHERE schemaname='public' AND tablename=v_table)
                THEN RAISE EXCEPTION 'Unexpected client policy: %',v_table; END IF;
            END LOOP;
            IF EXISTS (SELECT 1 FROM public.fanpa_federations WHERE is_active)
               OR EXISTS (SELECT 1 FROM public.fanpa_administrators WHERE active)
               OR EXISTS (SELECT 1 FROM public.fanpa_represented_schools WHERE active)
               THEN RAISE EXCEPTION 'Implicit federative activation'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint
              WHERE conrelid='public.user_roles'::regclass
                AND pg_get_constraintdef(oid) LIKE '%school_admin%')
              THEN RAISE EXCEPTION 'Original role constraints changed'; END IF;
            BEGIN
              INSERT INTO public.user_roles(user_id,role)
                VALUES ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','fanpa_admin');
              RAISE EXCEPTION 'Old user role unexpectedly gained fanpa_admin';
            EXCEPTION WHEN check_violation THEN NULL; END;
            BEGIN
              INSERT INTO public.fanpa_represented_schools(federation_id,school_id)
                VALUES ('ffffffff-ffff-4fff-8fff-ffffffffffff',
                        '33333333-3333-4333-8333-333333333333');
              RAISE EXCEPTION 'Unknown school allowed';
            EXCEPTION WHEN foreign_key_violation THEN NULL; END;
            BEGIN
              INSERT INTO public.fanpa_administrators(federation_id,user_id)
                VALUES ('ffffffff-ffff-4fff-8fff-ffffffffffff',
                        'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
              RAISE EXCEPTION 'Unknown admin allowed';
            EXCEPTION WHEN foreign_key_violation THEN NULL; END;
            UPDATE public.fanpa_federations SET is_active=true
              WHERE name='Fictitious pilot federation';
            UPDATE public.fanpa_administrators SET active=true;
            UPDATE public.fanpa_represented_schools SET active=true;
            UPDATE public.fanpa_represented_schools SET active=false
              WHERE school_id='11111111-1111-4111-8111-111111111111';
            IF EXISTS (SELECT 1 FROM public.fanpa_represented_schools WHERE active)
              THEN RAISE EXCEPTION 'School revocation failed'; END IF;
          END $checks$;
          SQL
      - name: Verify anon/authenticated cannot read federation data
        shell: bash
        run: |
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE anon; SELECT * FROM public.fanpa_federations;" >/dev/null 2>&1; then
            echo "FAIL: anon accessed federation tables"; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT * FROM public.fanpa_administrators;" >/dev/null 2>&1; then
            echo "FAIL: authenticated accessed membership tables"; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT * FROM public.fanpa_represented_schools;" >/dev/null 2>&1; then
            echo "FAIL: authenticated accessed school representation"; exit 1
          fi
          echo "Service-only federation schema isolation verified"
