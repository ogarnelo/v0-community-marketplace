name: Pilot public guest HTTP contract

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/api/marketplace/my-school/route.ts"
      - "app/api/marketplace/listing-draft/route.ts"
      - "app/api/messages/conversation-summary/route.ts"
      - "scripts/pilot-guest-http-smoke.mjs"
      - ".github/workflows/pilot-live-guest-http-contract.yml"

permissions:
  contents: read

jobs:
  public-guest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22 without package installs
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only external HTTP 401 verification
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node scripts/pilot-guest-http-smoke.mjs https://www.wetudy.com > /tmp/wetudy-guest-contract.txt 2>&1
          result=$?
          set -e
          cat /tmp/wetudy-guest-contract.txt
          {
            echo "## WETUDY · HTTP invitado de producción"
            echo
            echo "Solo lecturas GET sin cookies ni secretos. No valida sesiones reales, DR ni AMPA."
            echo
            echo '~~~text'
            cat /tmp/wetudy-guest-contract.txt
            echo '~~~'
            echo
            echo "Código de salida: $result"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
