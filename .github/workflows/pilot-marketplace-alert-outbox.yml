name: Wetudy pilot alert outbox isolated PostgreSQL regression
on:
  pull_request:
    paths:
      - ".github/workflows/pilot-marketplace-alert-outbox.yml"
      - "app/api/cron/marketplace-alert-outbox/route.ts"
      - "app/api/marketplace/listings/match-saved-searches/route.ts"
      - "docs/pilot/sql/p0_alert_pause_outbox_review_only_20261119.sql"
      - "__tests__/launch/p0-alert-paused-lease-runtime.test.mjs"
      - "__tests__/launch/p0-alert-seller-global-off-runtime.test.mjs"
      - "supabase/migrations/20261110111353_marketplace_alert_outbox_v1.sql"
      - "scripts/pilot-marketplace-alert-outbox-synthetic.sql"
      - "supabase/migrations/20261110113419_marketplace_listing_postal_snapshot_v1.sql"
      - "scripts/pilot-marketplace-postcode-snapshot.sql"
      - "supabase/migrations/20261110114223_marketplace_alert_outbox_health_v1.sql"
      - "scripts/pilot-marketplace-alert-outbox-health.sql"
      - "supabase/migrations/20261110121643_marketplace_alert_delivery_progress.sql"
      - "scripts/pilot-marketplace-alert-partial-delivery.sql"
      - "supabase/migrations/20261110145531_marketplace_alert_defer_photos_v1.sql"
      - "scripts/pilot-marketplace-alert-defer-photos.sql"
      - "supabase/migrations/20261110155518_marketplace_alert_discovery_checkpoint_v1.sql"
      - "scripts/pilot-marketplace-alert-discovery-checkpoint.sql"
      - "supabase/migrations/20261110161156_saved_search_preference_stamp_v1.sql"
      - "scripts/pilot-marketplace-saved-search-optout.sql"
      - "supabase/migrations/20261110164742_saved_search_match_delivery_invalidation.sql"
      - "scripts/pilot-marketplace-live-radius-invalidation.sql"
      - "supabase/migrations/20261110194657_marketplace_school_link_invalidation_v2.sql"
      - "scripts/pilot-marketplace-live-school-relink.sql"
      - "supabase/migrations/20261110211000_marketplace_alert_email_send_intents_v1.sql"
      - "scripts/pilot-marketplace-alert-email-intents.sql"
      - "supabase/migrations/20261110215000_marketplace_alert_outbox_review_hold_v1.sql"
      - "scripts/pilot-marketplace-alert-review-hold.sql"
      - "supabase/migrations/20261110223000_marketplace_alert_reconcile_accepted_v1.sql"
      - "scripts/pilot-marketplace-alert-manual-reconciliation.sql"
      - "supabase/migrations/20261110224500_marketplace_alert_provider_receipt_unique.sql"
      - "scripts/pilot-marketplace-alert-provider-receipt-unique.sql"
      - "supabase/migrations/20261110231500_marketplace_alert_expired_lease_fencing.sql"
      - "scripts/pilot-marketplace-alert-expired-lease-fencing.sql"
      - "scripts/pilot-marketplace-alert-full-schema-smoke.sql"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outbox-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wetudy_ci
          POSTGRES_PASSWORD: wetudy_ci
          POSTGRES_DB: wetudy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wetudy_ci -d wetudy_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://wetudy_ci:wetudy_ci@127.0.0.1:5432/wetudy_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client and assert local-only fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python3 - <<'PY'
          from urllib.parse import urlsplit
          import os
          url = urlsplit(os.environ["DATABASE_URL"])
          if url.hostname not in ("127.0.0.1", "localhost", "::1") or url.path != "/wetudy_ci":
              raise SystemExit("Refusing non-local or non-disposable database")
          PY
      - name: Run isolated outbox migration and DB behavior assertions
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-outbox-synthetic.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-postcode-snapshot.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-outbox-health.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-partial-delivery.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-defer-photos.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-discovery-checkpoint.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-saved-search-optout.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-live-radius-invalidation.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-live-school-relink.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-email-intents.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-review-hold.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-manual-reconciliation.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-provider-receipt-unique.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-expired-lease-fencing.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-alert-full-schema-smoke.sql
          # Install the EXACT review-only pause candidate into this disposable
          # fully migrated DB, never into Education Marketplace production.
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f docs/pilot/sql/p0_alert_pause_outbox_review_only_20261119.sql
          test "$(psql -X -v ON_ERROR_STOP=1 -At "$DATABASE_URL" -c "SELECT NOT has_function_privilege('anon','public.marketplace_alert_pause_outbox_v1(uuid,uuid)','EXECUTE') AND NOT has_function_privilege('authenticated','public.marketplace_alert_pause_outbox_v1(uuid,uuid)','EXECUTE') AND has_function_privilege('service_role','public.marketplace_alert_pause_outbox_v1(uuid,uuid)','EXECUTE') AS service_only_pause;")" = "t"
