name: Wetudy marketplace geosearch 6000 synthetic PostGIS benchmark
on:
  pull_request:
    paths:
      - ".github/workflows/pilot-marketplace-postgis-benchmark.yml"
      - "scripts/pilot-marketplace-postgis-fixture.sql"
      - "scripts/pilot-marketplace-postgis-benchmark.mjs"
      - "scripts/pilot-marketplace-postgis-before.sql"
      - "scripts/pilot-marketplace-postgis-after.sql"
      - "supabase/migrations/20261109205354_marketplace_postal_radius_v1.sql"
      - "supabase/migrations/20261109205725_marketplace_postal_fast_sphere.sql"
      - "supabase/migrations/20261109221011_marketplace_global_nearest_v1.sql"
      - "supabase/migrations/20261109222923_marketplace_radius_prefilter_v2.sql"
      - "supabase/migrations/20261110074207_marketplace_listing_cp_first.sql"
      - "scripts/pilot-marketplace-postcode-authority.sql"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-postgis-6000:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: wetudy_geo
          POSTGRES_PASSWORD: wetudy_geo
          POSTGRES_DB: wetudy_geo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wetudy_geo -d wetudy_geo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://wetudy_geo:wetudy_geo@127.0.0.1:5432/wetudy_geo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install client and refuse any remote database
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python3 - <<'PY'
          from urllib.parse import urlsplit
          import os
          url = urlsplit(os.environ["DATABASE_URL"])
          if url.hostname not in ("127.0.0.1", "localhost", "::1") or url.path != "/wetudy_geo":
              raise SystemExit("Refusing non-local/non-sandbox database")
          PY
      - name: Load disposable fixture and exact production geospatial migrations
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-postgis-fixture.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20261109205354_marketplace_postal_radius_v1.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20261109205725_marketplace_postal_fast_sphere.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20261109221011_marketplace_global_nearest_v1.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-postgis-before.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20261109222923_marketplace_radius_prefilter_v2.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-postgis-after.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20261110074207_marketplace_listing_cp_first.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/pilot-marketplace-postcode-authority.sql
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -c 'analyze public.marketplace_postal_centroids;'
      - name: Verify pagination and permissions, benchmark p50/p95 without production data
        run: node scripts/pilot-marketplace-postgis-benchmark.mjs
