name: Wetudy offline disaster recovery scope audit
on:
  pull_request:
    paths:
      - "scripts/pilot-dr-scope-audit.py"
      - "scripts/pilot-full-local-db-clone-recovery.py"
      - ".github/workflows/pilot-dr-scope-audit.yml"
permissions:
  contents: read
jobs:
  dr-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record verified production inventory and recovery gaps without accessing production
        run: python3 scripts/pilot-dr-scope-audit.py
      - name: Prove that incomplete coverage cannot pass the full-DR readiness gate
        shell: bash
        run: |
          if python3 scripts/pilot-dr-scope-audit.py --require-full-coverage; then
            echo "::error::Incomplete recovery incorrectly passed full coverage gate"
            exit 1
          fi
          echo "PASS full-production-DR gate remains blocked as expected"
