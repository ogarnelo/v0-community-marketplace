name: Wetudy encrypted database backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_DATABASE_URL: ${{ secrets.WETUDY_BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.WETUDY_BACKUP_ENCRYPTION_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_DATABASE_URL" || { echo "Missing WETUDY_BACKUP_DATABASE_URL"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || { echo "Missing WETUDY_BACKUP_ENCRYPTION_PASSWORD"; exit 1; }
          test "${#BACKUP_ENCRYPTION_PASSWORD}" -ge 20 || { echo "Encryption password must have at least 20 characters"; exit 1; }

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database and encrypt before upload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup
          export PGCONNECT_TIMEOUT=15
          pg_dump --dbname="$BACKUP_DATABASE_URL" --format=custom --no-owner --no-acl --file=backup/wetudy.dump
          test -s backup/wetudy.dump
          pg_restore --list backup/wetudy.dump > /dev/null
          # pg_dump --no-acl does not preserve grants. Record metadata only.
          psql -X -q -A -t -v ON_ERROR_STOP=1 --dbname="$BACKUP_DATABASE_URL" -f scripts/pilot-acl-json-snapshot-readonly.sql > backup/wetudy-acl-snapshot.raw
          python3 scripts/pilot-backup-acl-snapshot-validate.py backup/wetudy-acl-snapshot.raw > backup/wetudy-acl-snapshot.json
          test -s backup/wetudy-acl-snapshot.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in backup/wetudy-acl-snapshot.json -out backup/wetudy-acl-snapshot.json.enc -pass env:BACKUP_ENCRYPTION_PASSWORD
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup/wetudy-acl-snapshot.json.enc -out backup/wetudy-acl-snapshot.verified -pass env:BACKUP_ENCRYPTION_PASSWORD
          cmp backup/wetudy-acl-snapshot.json backup/wetudy-acl-snapshot.verified
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup/wetudy.dump -out backup/wetudy.dump.enc \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in backup/wetudy.dump.enc -out backup/verified.dump \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          cmp backup/wetudy.dump backup/verified.dump
          sha256sum backup/wetudy.dump.enc backup/wetudy-acl-snapshot.json.enc > backup/SHA256SUMS.txt
          rm -f backup/wetudy.dump backup/verified.dump backup/wetudy-acl-snapshot.raw backup/wetudy-acl-snapshot.json backup/wetudy-acl-snapshot.verified
          printf 'Encrypted backup created and decryption verified.\n'

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: wetudy-encrypted-postgres-backup
          path: |
            backup/wetudy.dump.enc
            backup/wetudy-acl-snapshot.json.enc
            backup/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
