name: Critical contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  critical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --ignore-scripts
      - name: Critical contract tests
        run: npm run test:critical-contracts
