name: Critical contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  critical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --ignore-scripts
      - name: Critical contract tests
        run: npm run test:critical-contracts

      - name: Synthetic local recovery controls (no real backup / no network DB)
        run: |
          python3 -m pip install --only-binary=:all: "cryptography==48.0.1"
          python3 -m unittest scripts/test_pilot_founder_macos_archived_rls_replay.py -v
