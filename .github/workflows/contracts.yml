name: Critical contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  critical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --ignore-scripts
      - name: Critical contract tests
        run: npm run test:critical-contracts
      - name: Commerce and moderation HTTP privacy boundaries
        run: node --test __tests__/launch/pilot-commerce-report-error-boundary-runtime.test.mjs
      - name: Listing deletion must preserve history and avoid destructive child pre-deletes
        run: node --test __tests__/launch/pilot-listing-deletion-failclosed-history-runtime.test.mjs
      - name: Draft DB commit happens before Storage cleanup
        run: node --test __tests__/launch/pilot-draft-storage-commit-order-runtime.test.mjs
      - name: Editor save and photo restore synchronous single-flight guards
        run: node --test __tests__/launch/pilot-edit-singleflight-submit-recovery.test.mjs
      - name: Saved search matcher must separate seller Auth from signed worker and never cache
        run: node --test __tests__/launch/pilot-alert-matcher-auth-and-cache-runtime.test.mjs
      - name: Message send and conversation summary fail closed on Auth outage
        run: node --test __tests__/launch/pilot-message-auth-error-before-admin-runtime.test.mjs
      - name: Distance feed authorization before privileged client creation
        run: node --test __tests__/launch/pilot-feed-distance-before-admin-runtime.test.mjs
      - name: Seller-only repair for missing listing photo metadata
        run: node --test __tests__/launch/pilot-partial-listing-photo-recovery.test.mjs
      - name: My School auth and profile outages must not masquerade as guests
        run: node --test __tests__/launch/pilot-school-auth-outage-fail-closed-runtime.test.mjs
      - name: Authenticated school catalog runtime isolation across students and school admins
        run: node --test __tests__/launch/pilot-my-school-cross-scope-http-runtime.test.mjs
      - name: Message first read must precede notification side effects
        run: node --test __tests__/launch/pilot-first-message-read-before-notification-runtime.test.mjs
      - name: Seller listing INSERT idempotency and ambiguous commit reconciliation
        run: node --test __tests__/launch/pilot-listing-insert-owner-recovery.test.mjs
      - name: Recover partial listing publication without duplicate INSERT
        run: node --test __tests__/launch/pilot-publish-partial-commit-resume.test.mjs
      - name: Message recipient lookups fail before notification side effects
        run: node --test __tests__/launch/pilot-message-recipient-fanout-failclosed-runtime.test.mjs
      - name: New edit photos committed before deleting old photographs
        run: node --test __tests__/launch/pilot-edit-photo-delete-after-new-upload.test.mjs
      - name: Edit page school queries must fail closed on RLS errors
        run: node --test __tests__/launch/pilot-edit-page-school-error-boundary-runtime.test.mjs
      - name: Edit listing upload rollback must preserve existing photographs
        run: node --test __tests__/launch/pilot-edit-photo-upload-rollback-runtime.test.mjs
      - name: Marketplace feed and school catalog private errors
        run: node --test __tests__/launch/pilot-feed-school-private-http-error-runtime.test.mjs
      - name: New listing Storage rollback before listing INSERT
        run: node --test __tests__/launch/pilot-new-listing-photo-preinsert-rollback-runtime.test.mjs
      - name: Listing edit confirms affected row and photo ownership
        run: node --test __tests__/launch/pilot-edit-listing-write-confirmation-contract.test.mjs
      - name: Conversation summary authorization and private HTTP
        run: node --test __tests__/launch/pilot-conversation-summary-private-http-runtime.test.mjs __tests__/launch/conversation-summary-privacy.test.mjs
      - name: Saved search matcher private error contract
        run: node --test __tests__/launch/pilot-saved-search-sensitive-error-contract.test.mjs
      - name: Listing create edit and draft UI error redaction
        run: node --test __tests__/launch/pilot-listing-form-error-redaction.test.mjs
      - name: Private drafts and message notification HTTP authorization
        run: node --test __tests__/launch/pilot-private-draft-message-api-runtime.test.mjs
      - name: Messages course and saved-search private query failures
        run: node --test __tests__/launch/pilot-private-inbox-course-failclosed.test.mjs
      - name: Authenticated marketplace page permission-failure regression
        run: node --test __tests__/launch/pilot-auth-marketplace-read-failclosed-runtime.test.mjs
      - name: Production ACL reader compatibility
        run: node --test __tests__/launch/pilot-prod-acl-reader-compat.test.mjs
      - name: Public photos remain readable after anonymous ACL revocation
        run: node --test __tests__/launch/pilot-prod-photo-rls-after-listings-acl.test.mjs
      - name: Listing detail authorized photo reads and metadata
        run: node --test __tests__/launch/pilot-listing-detail-private-photo-authorization-runtime.test.mjs
      - name: School report cron denies revoked admins and inactive centres
        run: node --test __tests__/launch/school-impact-report-recipient-security.test.mjs __tests__/launch/school-impact-schedule-calendar.test.mjs __tests__/launch/pilot-school-impact-cron-authorization-runtime.test.mjs
      - name: School impact PDF scope and revoked school contracts
        run: node --test __tests__/launch/school-impact-isolation-contract.test.mjs
      - name: New password forms agree on minimum length and messages
        run: node --test __tests__/launch/password-minimum-consistency.test.mjs
      - name: School administrator grant denials and runtime tests
        run: node --test __tests__/launch/school-admin-grant-guard.test.mjs __tests__/launch/school-admin-grant-runtime.test.mjs
      - name: Buy-now notification minimizes buyer identity
        run: node --test __tests__/launch/pilot-buy-now-notification-minimization.test.mjs
      - name: Read-only commerce reconciliation respects agreement flows
        run: node --test __tests__/launch/pilot-commerce-readonly-audit.test.mjs
      - name: Manual school report partial-send reconciliation
        run: node --test __tests__/launch/pilot-manual-school-report-partial-send.test.mjs
      - name: Post-load school activation and manual send checks
        run: node --test __tests__/launch/pilot-school-report-postload-active.test.mjs
      - name: Review-only cross-school administrator index safety contracts
        run: node --test __tests__/launch/p0-school-admin-global-unique-review.test.mjs
      - name: Two-school donation Data API probe mock-contracts only
        run: node --test __tests__/launch/p0-donation-two-school-data-api-readonly.test.mjs
      - name: Supabase admin default ACL executor diagnostic is read only
        run: node --test __tests__/launch/p0-admin-default-acl-executor-readonly.test.mjs
      - name: Federation reporting scope revocation and runtime denials
        run: node --test __tests__/launch/federation-reporting-scope-runtime.test.mjs
      - name: Federation KPI projection suppresses small school metrics
        run: node --test __tests__/launch/federation-kpi-projection-runtime.test.mjs
      - name: Federation reporting hierarchy denies cycles and unverified links
        run: node --test __tests__/launch/federation-reporting-hierarchy-runtime.test.mjs
      - name: Federation report filter authorization runtime
        run: node --test __tests__/launch/federation-report-filters-runtime.test.mjs
      - name: Federated report full-scope privacy and authorization runtime
        run: node --test __tests__/launch/federation-report-gateway-runtime.test.mjs
      - name: Federation identity schema stays review only and deny-by-default
        run: node --test __tests__/launch/p0-federation-schema-review-only.test.mjs
      - name: Federation KPI adapter validates active school and minimizes PII
        run: node --test __tests__/launch/federation-school-kpi-adapter-runtime.test.mjs
      - name: Federation verified legal AMPA snapshot and complete scope
        run: node --test __tests__/launch/federation-authority-snapshot-runtime.test.mjs
      - name: Federated report service legal graph to KPI and fresh reauthorization
        run: node --test __tests__/launch/federation-report-service-runtime.test.mjs
      - name: Federation dashboard view-model privacy and KPI integrity
        run: node --test __tests__/launch/federation-dashboard-view-model-runtime.test.mjs
      - name: FAMPA and CEAPA read-only dashboard render and suppression
        run: node --test __tests__/launch/federation-dashboard-component-runtime.test.mjs
      - name: Local federation dashboard preview must stay 404 in production
        run: node --test __tests__/launch/federation-dashboard-local-preview-runtime.test.mjs
      - name: School impact reporting incidents read only own listings
        run: node --test __tests__/launch/school-impact-report-scoped-incidents-runtime.test.mjs
      - name: School impact PDF must reauthorize after privileged reads
        run: node --test __tests__/launch/school-impact-pdf-postflight-runtime.test.mjs
      - name: Manual school impact email reauth before provider call
        run: node --test __tests__/launch/school-impact-manual-send-postflight-runtime.test.mjs
      - name: School impact cron subscription complete-page and count-fence tests
        run: node --test __tests__/launch/school-impact-cron-subscription-pages-runtime.test.mjs
      - name: Buy-now accepted offer DB actor constraint
        run: node --test __tests__/launch/pilot-buy-now-reservation-cas.test.mjs
      - name: P0 atomic buy-now candidate remains review-only
        run: node --test __tests__/launch/p0-buy-now-atomic-candidate-contract.test.mjs
      - name: P0 cron durable claim contract remains review-only
        run: node --test __tests__/launch/p0-school-impact-cron-claim-contract.test.mjs
      - name: School impact subscription write requires fresh school authorization
        run: node --test __tests__/launch/school-impact-subscription-postflight-runtime.test.mjs
      - name: Two-buyer isolated PG17 concurrency harness integrity
        run: node --test __tests__/launch/p0-pg17-two-buyers-concurrency-contract.test.mjs
      - name: Manual school report monthly deduplication using audit and marker
        run: node --test __tests__/launch/school-impact-manual-send-postflight-runtime.test.mjs

      - name: Report subscription edits must preserve last delivered month
        run: node --test __tests__/launch/pilot-report-subscription-marker-preservation.test.mjs

      - name: School report provider skipped must not mark a fake delivery
        run: node --test __tests__/launch/school-impact-mail-skipped-runtime.test.mjs

      - name: Madrid monthly school report period boundary runtime
        run: node --test __tests__/launch/school-impact-report-madrid-month-runtime.test.mjs

      - name: Buy-now delivery input must reject free shipping before reservation
        run: node --test __tests__/launch/p0-buy-now-delivery-input-runtime.test.mjs

      - name: Payment service must not downgrade captured or processing intents
        run: node --test __tests__/launch/p0-payment-draft-no-downgrade-runtime.test.mjs

      - name: Stripe checkout payment status CAS and strict shipping guard
        run: node --test __tests__/launch/p0-stripe-checkout-status-cas-runtime.test.mjs

      - name: Accepted-offer payment read and reservation write confirmation
        run: node --test __tests__/launch/pilot-payment-shipping-state-and-auth-runtime.test.mjs

      - name: Stripe webhook invoice identity and registered session attestation
        run: node --test __tests__/launch/p0-stripe-webhook-attestation-runtime.test.mjs

      - name: Shipping label requires payment/actor/price equality before Sendcloud
        run: node --test __tests__/launch/p0-shipment-label-payment-identity-runtime.test.mjs

      - name: Delivery must preserve payment buyer-seller-listing identity
        run: node --test __tests__/launch/p0-shipment-delivery-payment-identity-runtime.test.mjs

      - name: Dispatch only after succeeded payment with same buyer seller and listing
        run: node --test __tests__/launch/p0-shipment-dispatch-payment-identity-runtime.test.mjs

      - name: Applied P0 production SQL records must remain dormant and secure
        run: node --test __tests__/launch/p0-applied-migration-audit-contract.test.mjs
