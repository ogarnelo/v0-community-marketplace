name: Piloto — comprobación pública sin escritura

on:
  pull_request:
    paths:
      - scripts/mvp-readiness.mjs
      - .github/workflows/pilot-public-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar rutas y contenido real de producción (solo lectura)
        run: node scripts/mvp-readiness.mjs https://www.wetudy.com
